<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* přechod mezi sekcemi (prechod.js): nová stránka se zapojí do animace prohlížeče */
(function(){try{var d=sessionStorage.getItem('gmhs-prechod');sessionStorage.removeItem('gmhs-prechod');
if(!d||!matchMedia('(min-width: 1025px)').matches)return;var h=document.documentElement;h.classList.add('prechod-'+d);
var st=document.createElement('style');st.textContent='@view-transition{navigation:auto}';document.head.appendChild(st);
function konec(){h.classList.remove('prechod-'+d);h.style.removeProperty('--vt-draha');st.remove();}
addEventListener('pagereveal',function(e){h.style.setProperty('--vt-draha',(h.clientWidth-49)+'px');if(e.viewTransition){e.viewTransition.finished.then(konec,konec);}else konec();},{once:true});
setTimeout(konec,3000);}catch(e){}})();
</script>
<title>{{nazev}}</title>
<meta name="description" content="{{popis}}">
